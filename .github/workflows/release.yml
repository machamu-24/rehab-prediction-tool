name: Build and publish desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "検証成功後にGitHub Releaseを公開する"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Verify static demo still builds
        run: pnpm build:demo

  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Build desktop application
        run: pnpm build:desktop
      - name: Build installer and audit its contents
        run: pnpm exec electron-builder --config desktop/electron-builder.config.cjs --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Install and test actual application
        run: node scripts/test-built-installer.mjs
        env:
          REHAB_DESKTOP_REPORT_DIR: dist/installer-reports
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/installers/*.exe
            dist/installers/*.dmg
            dist/installer-reports/*.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    needs: [tests, installers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Verify complete artifact set and create checksums
        run: node scripts/prepare-installer-release.mjs
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION_TAG="v$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$RELEASE_TAG" = "$VERSION_TAG"
            gh release create "$VERSION_TAG" release-assets/*.exe release-assets/*.dmg release-assets/SHA256SUMS.txt release-assets/INSTALLER_TESTS.json --verify-tag --title "RehabPredict $VERSION_TAG（実行環境・SQLite内蔵）" --notes-file release/RELEASE_NOTES.md --latest
          else
            gh release create "$VERSION_TAG" release-assets/*.exe release-assets/*.dmg release-assets/SHA256SUMS.txt release-assets/INSTALLER_TESTS.json --target "$GITHUB_SHA" --title "RehabPredict $VERSION_TAG（実行環境・SQLite内蔵）" --notes-file release/RELEASE_NOTES.md --latest
          fi

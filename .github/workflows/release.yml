name: Build and publish local release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "検証成功後にGitHub Releaseを公開する"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  platform-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build:release
      - run: pnpm test:release

  mysql-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:release
      - name: Start local MySQL for integration test
        run: |
          sudo systemctl start mysql.service
      - run: node scripts/test-release.mjs --mysql
        env:
          REHAB_RELEASE_TEST_MYSQL: mysql://root:root@127.0.0.1:3306/
      - name: Verify ZIP contents and executable modes
        run: |
          python3 - <<'PY'
          import zipfile, glob, json
          name = glob.glob('dist/release/*.zip')[0]
          with zipfile.ZipFile(name) as z:
              assert z.testzip() is None
              assert all('/.env' not in n and '/backups/' not in n and '/node_modules/' not in n for n in z.namelist())
              for i in z.infolist():
                  if i.filename.endswith('.command'):
                      assert (i.external_attr >> 16) & 0o111
              seed = json.loads(z.read(next(n for n in z.namelist() if n.endswith('/release/literature.seed.json'))))
              assert sorted(seed['payload']['tables']) == ['literature_rules', 'outcomes']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: local-release
          path: |
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    needs: [platform-check, mysql-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: local-release
          path: release-assets
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION_TAG="v$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$RELEASE_TAG" = "$VERSION_TAG"
            gh release create "$VERSION_TAG" release-assets/* --verify-tag --title "RehabPredict $VERSION_TAG（Windows・Mac通常版）" --notes-file release/RELEASE_NOTES.md --latest
          else
            gh release create "$VERSION_TAG" release-assets/* --target "$GITHUB_SHA" --title "RehabPredict $VERSION_TAG（Windows・Mac通常版）" --notes-file release/RELEASE_NOTES.md --latest
          fi
